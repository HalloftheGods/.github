name: Compass Pipeline
on:
  workflow_call:
    inputs:
      plugin_slug:
        description: 'The directory name the plugin should have (e.g. xophz-compass)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  auto-version:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: HalloftheGods/.github/.github/workflows/auto-version.yml@main
    with:
      plugin_slug: ${{ inputs.plugin_slug != '' && inputs.plugin_slug || github.event.repository.name }}

  daily-final:
    if: github.event_name == 'schedule'
    uses: HalloftheGods/.github/.github/workflows/daily-final-version.yml@main
    with:
      plugin_slug: ${{ inputs.plugin_slug != '' && inputs.plugin_slug || github.event.repository.name }}
