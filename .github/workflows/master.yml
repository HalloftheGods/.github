name: Compass Pipeline
on:
  workflow_call:
    inputs:
      type:
        description: 'Type of project: "auto", "plugin", or "theme"'
        required: false
        type: string
        default: 'auto'
      slug:
        description: 'Slug / directory name (e.g. xophz-magic-hat)'
        required: false
        type: string
      plugin_slug:
        description: 'Deprecated alias for slug'
        required: false
        type: string

permissions:
  contents: write

jobs:
  auto-version:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: HalloftheGods/.github/.github/workflows/auto-version.yml@main
    with:
      type: ${{ inputs.type }}
      slug: ${{ inputs.slug != '' && inputs.slug || inputs.plugin_slug != '' && inputs.plugin_slug || github.event.repository.name }}

  daily-final:
    if: github.event_name == 'schedule'
    uses: HalloftheGods/.github/.github/workflows/daily-final-version.yml@main
    with:
      type: ${{ inputs.type }}
      slug: ${{ inputs.slug != '' && inputs.slug || inputs.plugin_slug != '' && inputs.plugin_slug || github.event.repository.name }}
